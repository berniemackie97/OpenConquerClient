[info]
info0=~~~~The taoist is a master of abundant magic spells. They can choose to\n~~~~be fire taoists who are good at magic damage or water taoists who are\n~~~~great for buffing allies.
info1=~~~~Wielding their dual weapons, trojans are good melee damage\n~~~~dealers, and are capable of wearing light armors.
info2=~~~~The archer is the best ranged attack class. Furthermore, it's the\n~~~~only class that can evade blows by flying.
info3=~~~~The warrior is a great tank class, especially when employing a\n~~~~shield for additional defense.
info4=~~~~Proficient in martial arts and specialized in a variety of\n~~~~mysterious arts of guerilla warfare, Ninjas boast the\n~~~~strongest attack while suffering from a comparatively frail\n~~~~defense.
info5=Monks and Saints have deep understanding\nin both physical and spiritual world!\nTheir powerful martial skill and buff skill\nmake them a helpful member in the team!
infoII0=You can be a water or fire taoist when promoted at level 40. The fire taoist is the most dangerous magic using class, learning devastating spells and causing more damage than other taoists. The water taoist can study spells that heal, cure or revive others, having lower requirements for many quests (such as rebirth).
infoII1=Trojans are all-out offensive melee attackers. Wielding two-handed weapons, they are unparalleled in either one-on-one fights or group attacks. However, they need time and effort to reach their goals.
infoII2=Archers are swift characters capable of flying, shooting multiple targets, using magical defenses and taking down their enemies at range. Because of these they excel as hunters and powerful levelers. The archer is a vital key to keeping commerce alive and helping level up water Taoist and other characters.
infoII3=The warrior is a rough and ready melee combat class. They are adept in the use of all kinds of weapons and can put on the heaviest armors of any class. In addition they can use shields for additional defense.
infoII4=Though weak in ranged or group attacks, and suffering from low HP and weak defense skills, Ninjas are experts in a wealth of powerful melee attack skills.
infoII5=Through intense martial arts training, the Monk and Saint can deal devastating damage to their opponents. Through meditation and contemplation, they can also call upon the gods to bless their allies.

