name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore OpenConquer.Client.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format OpenConquer.Client.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build OpenConquer.Client.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenConquer.Client.slnx --configuration Release --no-build --no-restore

  cross-platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
          - name: macOS
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore OpenConquer.Client.slnx --locked-mode

      - name: Build
        run: dotnet build OpenConquer.Client.slnx --configuration Release --no-restore

      # The client is the platform-specific half of this system, so the suite runs on every
      # target rather than only on the Linux quality job.
      - name: Test
        run: dotnet test OpenConquer.Client.slnx --configuration Release --no-build --no-restore
