name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_NOLOGO: 'true'

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore OpenConquer.Client.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format OpenConquer.Client.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build OpenConquer.Client.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenConquer.Client.slnx --configuration Release --no-build --no-restore

      - name: Install rendering prerequisites
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y xvfb dbus-x11 libgl1-mesa-dri libglx-mesa0 libglfw3

      - name: Validate indexed mesh framebuffer
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
        run: >-
          dbus-run-session -- xvfb-run -a dotnet run
          --project tests/Conformance/OpenConquer.Rendering.Conformance
          --configuration Release --no-build --no-restore -- --indexed-mesh

      - name: Verify loading media preparation
        run: python3 -m unittest discover -s tests/development -p "test_prepare_loading_media.py"

      - name: Verify launcher isolation across Unix users
        timeout-minutes: 3
        shell: bash
        run: |
          probe_output="tests/Fixtures/OpenConquer.Launcher.InstanceProbe/bin/Release/net10.0"
          probe_stage="$(sudo mktemp -d /tmp/oc-instance-probe.XXXXXXXX)"
          trap 'sudo rm -r -- "$probe_stage"' EXIT

          sudo cp -R -- "$probe_output/." "$probe_stage/"
          sudo chmod -R a=rX -- "$probe_stage"

          sudo -- "$(command -v dotnet)" \
            "$probe_stage/OpenConquer.Launcher.InstanceProbe.dll" \
            --verify-cross-uid

      - name: Detect local retail content
        id: retail
        shell: bash
        run: |
          if [[ -f content/retail-5517/manifest.json ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'Retail content is intentionally outside Git. Asset-dependent map, packaging and installation checks did not run.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify content set
        id: content_set
        if: steps.retail.outputs.available == 'true'
        run: >-
          dotnet run
          --project tools/OpenConquer.Content.Tool
          --configuration Release
          --no-build
          --no-restore
          --
          verify-content-set
          --content-set content/retail-5517
          --map-data-id 1010

      - name: Compile map asset deterministically
        id: map_compile
        if: steps.retail.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          for candidate in a b; do
            dotnet run \
              --project tools/OpenConquer.Content.Tool \
              --configuration Release \
              --no-build \
              --no-restore \
              -- \
              compile-map-asset \
              --source content/retail-5517/payload \
              --map-data-id 1010 \
              --destination "${{ runner.temp }}/1010-$candidate.ocmap"
          done

          cmp "${{ runner.temp }}/1010-a.ocmap" "${{ runner.temp }}/1010-b.ocmap"

      - name: Publish client
        run: >-
          dotnet publish
          src/OpenConquer.Client/OpenConquer.Client.csproj
          --configuration Release
          --no-restore
          --output "${{ runner.temp }}/openconquer-client"

      - name: Verify published client content
        id: published_content
        if: steps.retail.outputs.available == 'true'
        run: >-
          dotnet run
          --project tools/OpenConquer.Content.Tool
          --configuration Release
          --no-build
          --no-restore
          --
          verify-content-set
          --content-set "${{ runner.temp }}/openconquer-client/content/retail-5517"
          --map-data-id 1010

      - name: Reject legacy Server.dat from client publish
        shell: bash
        run: |
          match="$(
            find "${{ runner.temp }}/openconquer-client" \
              -type f \
              -iname 'Server.dat' \
              -print \
              -quit
          )"

          if [[ -n "$match" ]]; then
            echo "Legacy Server.dat must not be present in the published client: $match" >&2
            exit 1
          fi

      - name: Create CI release authority
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          release_root="${{ runner.temp }}/openconquer-release"
          private_key="$release_root/publisher-private.pem"
          public_key="$release_root/publisher-public.der"
          trust_file="$release_root/release-trust.json"

          mkdir -p "$release_root"

          openssl ecparam \
            -name prime256v1 \
            -genkey \
            -noout \
            -out "$private_key"

          openssl pkey \
            -in "$private_key" \
            -pubout \
            -outform DER \
            -out "$public_key"

          dotnet run \
            --project tools/OpenConquer.Product.Tool \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            create-release-trust \
            --public-key "$public_key" \
            --output "$trust_file"

          test -s "$private_key"
          test -s "$public_key"
          test -s "$trust_file"

      - name: Create CI release manifest
        id: release_manifest
        if: steps.retail.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          release_root="${{ runner.temp }}/openconquer-release"

          dotnet run \
            --project tools/OpenConquer.Product.Tool \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            create-release-manifest \
            --client-publish "${{ runner.temp }}/openconquer-client" \
            --target-runtime linux-x64 \
            --release-version "ci-${GITHUB_SHA}" \
            --release-sequence "${GITHUB_RUN_NUMBER}" \
            --minimum-launcher-version 1 \
            --output "$release_root/openconquer.release.json"

          test -s "$release_root/openconquer.release.json"

      - name: Sign and package CI release catalog
        id: release_package
        if: steps.retail.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          release_root="${{ runner.temp }}/openconquer-release"
          private_key="$release_root/publisher-private.pem"
          public_key="$release_root/publisher-public.der"
          manifest="$release_root/openconquer.release.json"
          raw_signature="$release_root/openconquer.release.der"
          signature_envelope="$release_root/openconquer.release.sig"
          package="$release_root/openconquer-client-linux-x64.zip"
          catalog="$release_root/openconquer.catalog.json"
          raw_catalog_signature="$release_root/openconquer.catalog.der"
          catalog_signature_envelope="$release_root/openconquer.catalog.sig"

          trap 'rm -f -- "$private_key"' EXIT

          openssl dgst \
            -sha256 \
            -sign "$private_key" \
            -out "$raw_signature" \
            "$manifest"

          dotnet run \
            --project tools/OpenConquer.Product.Tool \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            create-release-signature \
            --release-manifest "$manifest" \
            --public-key "$public_key" \
            --signature "$raw_signature" \
            --output "$signature_envelope"

          dotnet run \
            --project tools/OpenConquer.Product.Tool \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            create-release-package \
            --client-publish "${{ runner.temp }}/openconquer-client" \
            --release-manifest "$manifest" \
            --release-signature "$signature_envelope" \
            --public-key "$public_key" \
            --output "$package"

          dotnet run \
            --project tools/OpenConquer.Product.Tool \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            create-release-catalog \
            --release-package "$package" \
            --package-base-uri "https://releases.invalid/openconquer/" \
            --public-key "$public_key" \
            --expires-utc "$(date -u -d '+1 day' '+%Y-%m-%dT%H:%M:%SZ')" \
            --output "$catalog"

          openssl dgst \
            -sha256 \
            -sign "$private_key" \
            -out "$raw_catalog_signature" \
            "$catalog"

          dotnet run \
            --project tools/OpenConquer.Product.Tool \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            create-release-catalog-signature \
            --release-catalog "$catalog" \
            --public-key "$public_key" \
            --signature "$raw_catalog_signature" \
            --output "$catalog_signature_envelope"

          test -s "$raw_signature"
          test -s "$signature_envelope"
          test -s "$package"
          test -s "$catalog"
          test -s "$raw_catalog_signature"
          test -s "$catalog_signature_envelope"

          jq -e \
            --arg uri "https://releases.invalid/openconquer/openconquer-client-linux-x64.zip" \
            '.schemaVersion == 1
              and .productId == "OpenConquer"
              and (.expiresUtc | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
              and (.releases | length) == 1
              and .releases[0].targetRuntime == "linux-x64"
              and .releases[0].packageUri == $uri
              and (.releases[0].packageLength > 0)
              and (.releases[0].packageSha256 | test("^[0-9a-f]{64}$"))' \
            "$catalog"

          mapfile -t package_entries < <(zipinfo -1 "$package")
          test "${package_entries[0]}" = "openconquer.release.json"
          test "${package_entries[1]}" = "openconquer.release.sig"

          if printf '%s\n' "${package_entries[@]}" | grep -Eq '(^/|^\.\.?/|/\.\.?/)'; then
            echo "The release package contains a nonportable archive path." >&2
            exit 1
          fi

      - name: Publish launcher
        shell: bash
        run: |
          set -euo pipefail

          trust_file="${{ runner.temp }}/openconquer-release/release-trust.json"

          dotnet publish \
            src/OpenConquer.Launcher/OpenConquer.Launcher.csproj \
            --configuration Release \
            --no-restore \
            --output "${{ runner.temp }}/openconquer-launcher" \
            -p:OpenConquerReleaseTrustPath="$trust_file"

      - name: Reject managed product layout from launcher publish
        shell: bash
        run: |
          launcher="${{ runner.temp }}/openconquer-launcher"

          if [[ -e "$launcher/openconquer.installation.json" ]]; then
            echo "The raw launcher publish must not contain openconquer.installation.json." >&2
            exit 1
          fi

          if [[ -e "$launcher/openconquer.release.json" ]]; then
            echo "The raw launcher publish must not contain openconquer.release.json." >&2
            exit 1
          fi

          if [[ -e "$launcher/openconquer.release.sig" ]]; then
            echo "The raw launcher publish must not contain openconquer.release.sig." >&2
            exit 1
          fi

          if [[ -e "$launcher/release-trust.json" ]]; then
            echo "Release trust must be embedded rather than shipped as mutable loose metadata." >&2
            exit 1
          fi

          if [[ -e "$launcher/client" ]]; then
            echo "The raw launcher publish must not contain the managed client component." >&2
            exit 1
          fi

          if [[ -e "$launcher/releases" ]]; then
            echo "The raw launcher publish must not contain managed release generations." >&2
            exit 1
          fi

      - name: Reject game runtime content from launcher publish
        shell: bash
        run: |
          if [[ -e "${{ runner.temp }}/openconquer-launcher/content/retail-5517" ]]; then
            echo "Game runtime content must not be present in the published launcher." >&2
            exit 1
          fi

      - name: Verify managed product composition
        id: managed_composition
        if: steps.retail.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail

          managed="${{ runner.temp }}/openconquer-managed"
          release_root="${{ runner.temp }}/openconquer-release"

          dotnet run \
            --project tools/OpenConquer.Product.Tool \
            --configuration Release \
            --no-build \
            --no-restore \
            -- \
            stage-managed-product \
            --launcher-publish "${{ runner.temp }}/openconquer-launcher" \
            --client-publish "${{ runner.temp }}/openconquer-client" \
            --release-manifest "$release_root/openconquer.release.json" \
            --release-signature "$release_root/openconquer.release.sig" \
            --output "$managed"

          test -f "$managed/openconquer.installation.json"

          active_release="$(
            jq -er '
              if .schemaVersion == 2
                and .productId == "OpenConquer"
                and (.activeRelease | type) == "string"
                and .fallbackRelease == null
                and (keys | sort) == ["activeRelease", "fallbackRelease", "productId", "schemaVersion"]
              then .activeRelease
              else empty
              end
            ' "$managed/openconquer.installation.json"
          )"

          mapfile -t release_dirs < <(find "$managed/releases" -mindepth 1 -maxdepth 1 -print)
          test "${#release_dirs[@]}" -eq 1

          generation="${release_dirs[0]}"

          test -d "$generation"
          test "$(basename "$generation")" = "$active_release"
          test -f "$generation/openconquer.release.json"
          test -f "$generation/openconquer.release.sig"
          test -d "$generation/client"
          test -f "$generation/client/OpenConquer.Client"
          test -x "$generation/client/OpenConquer.Client"
          test -f "$generation/client/content/retail-5517/manifest.json"

          cmp "$release_root/openconquer.release.json" "$generation/openconquer.release.json"
          cmp "$release_root/openconquer.release.sig" "$generation/openconquer.release.sig"

          test ! -e "$managed/publisher-private.pem"
          test ! -e "$managed/publisher-public.der"
          test ! -e "$managed/release-trust.json"

      - name: Verify FreeType redistribution notices
        shell: bash
        run: |
          set -euo pipefail

          native_package_root="$(
            dotnet msbuild \
              src/OpenConquer.Rendering/OpenConquer.Rendering.csproj \
              -nologo \
              -getProperty:PkgOpenConquer_FreeType_Native
          )"

          client="${{ runner.temp }}/openconquer-client"
          release_root="${{ runner.temp }}/openconquer-release"
          managed="${{ runner.temp }}/openconquer-managed"
          manifest="$release_root/openconquer.release.json"
          package="$release_root/openconquer-client-linux-x64.zip"

          test -n "$native_package_root"
          test -d "$native_package_root"
          if [[ "${{ steps.retail.outputs.available }}" == 'true' ]]; then
            test -f "$manifest"
            test -f "$package"
          fi

          generation=''
          if [[ "${{ steps.retail.outputs.available }}" == 'true' ]]; then
            active_release="$(jq -er '.activeRelease' "$managed/openconquer.installation.json")"
            generation="$managed/releases/$active_release"
            test -d "$generation/client"
          fi

          for relative_path in \
            FTL.TXT \
            LICENSE.TXT \
            PROVENANCE.md \
            licenses/bdf/README \
            licenses/pcf/README
          do
            published="$client/third-party/freetype/$relative_path"
            installed="$generation/client/third-party/freetype/$relative_path"

            cmp "$native_package_root/$relative_path" "$published"

            if [[ "${{ steps.retail.outputs.available }}" != 'true' ]]; then
              continue
            fi

            jq -e \
              --arg path "third-party/freetype/$relative_path" \
              'any(.files[]; .path == $path)' \
              "$manifest" > /dev/null

            unzip -p \
              "$package" \
              "client/third-party/freetype/$relative_path" |
              cmp - "$published"

            cmp "$published" "$installed"
          done

          echo "Verified FreeType publish notices; signed-release and installation coverage requires local retail content."


      - name: Report content-dependent coverage
        if: always()
        shell: bash
        env:
          CONTENT_PRESENT: ${{ steps.retail.outputs.available }}
          CONTENT_SET: ${{ steps.content_set.outcome }}
          MAP_COMPILE: ${{ steps.map_compile.outcome }}
          PUBLISHED_CONTENT: ${{ steps.published_content.outcome }}
          RELEASE_MANIFEST: ${{ steps.release_manifest.outcome }}
          RELEASE_PACKAGE: ${{ steps.release_package.outcome }}
          MANAGED_COMPOSITION: ${{ steps.managed_composition.outcome }}
        run: |
          set -euo pipefail

          if [[ "$CONTENT_PRESENT" != 'true' && "$CONTENT_PRESENT" != 'false' ]]; then
            echo '::error::Content detection did not report availability.'
            exit 1
          fi

          gate_names=(
            'Content set verification'
            'Deterministic map compilation'
            'Published client content verification'
            'Signed release manifest preparation'
            'Release catalog and package verification'
            'Managed installation composition'
          )
          gate_results=(
            "$CONTENT_SET"
            "$MAP_COMPILE"
            "$PUBLISHED_CONTENT"
            "$RELEASE_MANIFEST"
            "$RELEASE_PACKAGE"
            "$MANAGED_COMPOSITION"
          )

          {
            printf '### Content-dependent CI coverage\n\n'
            printf 'Private client content present: **%s**\n\n' "$CONTENT_PRESENT"
            printf '| Gate | Outcome |\n| --- | --- |\n'
            for index in "${!gate_names[@]}"; do
              printf '| %s | %s |\n' "${gate_names[index]}" "${gate_results[index]}"
            done
          } >> "$GITHUB_STEP_SUMMARY"

          for result in "${gate_results[@]}"; do
            case "$result" in
              success|failure|cancelled|skipped) ;;
              *)
                echo "::error::Unexpected content-gate outcome: $result"
                exit 1
                ;;
            esac

            if [[ "$CONTENT_PRESENT" == 'true' && "$result" == 'skipped' ]] ||
               [[ "$CONTENT_PRESENT" == 'false' && "$result" != 'skipped' ]]; then
              echo "::error::Content-gate execution does not match source availability."
              exit 1
            fi
          done

  cross-platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
          - name: macOS
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json

      - name: Restore locked dependencies
        run: dotnet restore OpenConquer.Client.slnx --locked-mode

      - name: Build
        run: dotnet build OpenConquer.Client.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test OpenConquer.Client.slnx --configuration Release --no-build --no-restore
